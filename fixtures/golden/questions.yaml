# Golden retrieval questions for the M3 gate (tests/eval/test_m3_gate.py) and for
# `codegraph eval retrieval` (src/codegraph/cli.py) -- 5 natural-language questions
# from the M3 plan (docs/superpowers/plans/2026-07-15-m3-retrieval.md, Task 8), run
# through GraphQuery.search_code(mode="hybrid") (fulltext + REAL jina-embeddings-v2-
# base-code, RRF-fused) against the fixtures/workspace.yaml graph; hit@k = ANY item
# in the top `k` whose (service, qualified_name) is in that question's `accept` set.
#
# Format: {question, accept: [{service, symbol}], k}. `accept` is an OR-set --
# hit if ANY entry matches ANY top-k item (see evalx/retrieval_eval.run_questions).
#
# VERIFICATION POLICY (binding, M3 T8 brief): every `accept` entry below was checked
# against the ACTUAL fixture code AND the real T3/T4 chunking/retrieval pipeline
# BEFORE this file was written -- not copied verbatim from the plan doc's own
# suggested accept lists, which predate the chunker's exact grouping behavior. Two
# corrections were required (documented below); a third change is a ONE-TIME human
# rephrase of a question that missed hit@3 on the real model (also documented) --
# per the brief's anti-curve-fit rule, accept lists are NEVER widened to match
# whatever the model's actual top-k happened to return.
#
# CORRECTION 1 (questions 1 and 4): the plan's draft accept lists named METHODS
# (`OrderService.place`, `DocumentManagementClient.get_document`/`.create_document`)
# as the expected hit. Real symbols, yes (python_core.py builds a Node for every
# def) -- but NOT independently retrievable chunks: `chunking/splitter.py` rule 2
# ("a class that fits within max_chars becomes exactly ONE chunk under its own
# symbol_id -- methods are NOT split out") applies to every class in these fixtures
# (OrderService, DocumentManagementClient, KycWorkflow are all well under the
# 2000-byte default), confirmed both by chunking/augment.py's own docstring ("T3's
# own report: none of the 29 fixture files split, every class/function chunks
# whole") and empirically by running the real pipeline (analyze x3 real scip ->
# link -> chunk_embed with the real embedder) and inspecting the resulting
# (chunk_id, symbol_id, qualified_name) rows directly: OrderService.place's code
# lives in a chunk whose qualified_name is `app.services.order.OrderService` (the
# CLASS), never `.place` on its own -- same story for DocumentManagementClient's two
# methods, one chunk, qualified_name = the class. `accept` below names the class for
# both questions instead. (KycWorkflow, question 3, needed NO correction -- the
# plan's draft already named the class there, not `.run`.)
#
# CORRECTION 2 (question 5, ONE documented rephrase, per the brief's "max 1
# rephrase per question" allowance): the plan's original wording --
#   "где публикуется событие о проиндексированном документе"
# -- missed hit@3 on the real model (jina-embeddings-v2-base-code is an
# English-centric CODE embedding model; its cross-lingual match for the Russian
# passive participle "проиндексированном" was weak enough that
# `emit_document_indexed` didn't surface in the top 5 at all, let alone top 3 --
# verified live, not assumed). Rephrased to name the Kafka topic literally:
#   "где публикуется kafka-событие documents.indexed"
# -- a realistic question from an engineer who already knows the topic name from
# Kafka tooling/logs and wants to find the producer code, and stylistically
# consistent with question 2's OWN unchanged wording (which already names the
# `OrderCreated` event type literally rather than describing it). Verified live:
# `emit_document_indexed` is the #1 hybrid result for the rephrased wording (was:
# absent from the top 5 for the original wording). No other question needed a
# rephrase -- questions 1-4 all hit@3 on the FIRST (plan-original) wording once
# their accept lists reflected the real chunk granularity (correction 1).
#
# REAL GATE RESULTS (jina-embeddings-v2-base-code, dim=768, k=3, mode_used=hybrid
# for all 5 -- see m3-task-8-report.md for the full per-question top-3 dump):
#   1. hit=True rank=1   2. hit=True rank=2   3. hit=True rank=0
#   4. hit=True rank=2   5. hit=True rank=0
# Questions 2 and 4 hit at rank 2 (the very last position within k=3) -- a real,
# occasionally-close-to-the-edge result on real cross-lingual semantic search
# against a tiny (34-chunk) fixture corpus, left as-is (not curve-fit) since the
# contract is hit@k, not rank==0; see the report's Concerns section.
version: 1
questions:
  - question: "где создаётся заказ и пишется событие в outbox"
    accept:
      - {service: orders-api, symbol: app.services.order.OrderService}
      - {service: orders-api, symbol: app.routes.orders.create_order}
    k: 3
  - question: "кто обрабатывает событие OrderCreated"
    accept:
      - {service: kyc-worker, symbol: app.consumers.orders.handle_order_created}
    k: 3
  - question: "какой воркфлоу проверяет документы клиента"
    accept:
      - {service: kyc-worker, symbol: app.workflows.kyc.KycWorkflow}
      - {service: kyc-worker, symbol: app.activities.documents.verify_documents}
    k: 3
  - question: "где сервис ходит в document management по http"
    accept:
      - {service: kyc-worker, symbol: app.clients.document_management_client.DocumentManagementClient}
    k: 3
  - question: "где публикуется kafka-событие documents.indexed"
    accept:
      - {service: document-management, symbol: app.events.producer.emit_document_indexed}
    k: 3
