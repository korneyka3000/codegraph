# Helm-values-shaped env source (M7 T3, OPEN R1) -- referenced by workspace.yaml's
# `env_sources:`. linking/env_map.py walks the whole nested mapping, keeps every
# (KEY, string-value) pair whose value parses as a URL, and maps KEY -> the
# hostname's FIRST DNS label IFF that label exactly names a workspace service:
#   SERVICE_WORKER_URL  -> "worker"  (anchors gateway's auto-anchored StatusClient)
#   SERVICE_GATEWAY_URL -> "gateway" (harvested too; nothing consumes it today)
#   SERVICE_DOC_EVENTS_TOPIC is NOT a URL (urlparse finds no hostname) -- silently
#   ignored for service-mapping, exactly the honest-degradation the module pins.
#   SERVICE_AUDIT_URL is a REAL, known hostname (M9 T1 realstack leg) that names NO
#   workspace service at all -- build_env_service_map's own first-DNS-label match
#   against {"gateway", "worker"} misses ("audit" != either), so build_env_hostname_
#   map's UNFILTERED raw harvest is what actually anchors it: linking/http_routes.py's
#   tier-2a "external" split (see app/clients/audit_client.py's own idiom,
#   audit-client-decorator-sdk, workspace.yaml) -- honest boundary knowledge, not an
#   unmodeled miss.
env:
  SERVICE_WORKER_URL: "http://worker.kyc.svc.cluster.local:9000"
  SERVICE_GATEWAY_URL: "http://gateway.kyc.svc.cluster.local:8000"
  SERVICE_DOC_EVENTS_TOPIC: "kyc.document.events"
  SERVICE_AUDIT_URL: "http://audit.ext.prod.env:8000"
