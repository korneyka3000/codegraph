# Эталонные рёбра для fixtures/realstack — все ПЯТЬ пилотных gap'ов (M6 T5, см.
# docs/superpowers/reports/2026-07-23-pilot-real-services-gaps.md). Формат — как
# fixtures/golden/edges.yaml (dst: symbol XOR channel), но скоуп ЗДЕСЬ — ТОЛЬКО
# типы, которые проверяет M6-гейт (tests/eval/test_m6_gate.py): INVOKES_ACTIVITY,
# temporal_start-маркированный CALLS, CALLS_HTTP, CONSUMES, PRODUCES + CONTAINS
# topic→event. Полный CALLS-граф (module-level/ctor/self-method вызовы и т.п.)
# здесь сознательно НЕ размечается — вне скоупа M6-гейта (см. task-5-brief.md's
# Interfaces-раздел: гейт явно перечисляет только эти пять типов).
#
# M7 (T6): АДДИТИВНОЕ расширение под все M7-механизмы (open-gaps R1-R3) — новые
# записи помечены "M7" в комментарии группы; ни одна M6-запись не изменена и не
# удалена. M6-гейт читает этот же файл: его P/R-проверки теперь строже ровно на
# новые записи (та же фикстура даёт и новые рёбра), что санкционировано брифом T6
# ("аддитивная фикстура"). `mechanism:` на PRODUCES-записях ниже — ДОКУМЕНТАЦИЯ
# (evalx.load_golden_edges фильтрует mechanism только у CALLS; для остальных
# типов лишние ключи не читаются) — конфиденсы/механизмы пинит M7-гейт напрямую
# по staged-рёбрам, как M6 пинит heuristic/0.6 у base_class CONSUMES.
#
# Каждая запись выведена ВРУЧНУЮ из fixtures/realstack/services/*/app/*.py +
# workspace.yaml — см. комментарий у каждой группы для конкретного файла:строки.
#
# M10 (task-5, realstack legs): АДДИТИВНОЕ расширение, тот же протокол -- ОДНО
# новое сечение (singleton-CALLS), задокументировано у своей группы ниже:
#   1. module-level singleton dispatch (T1): worker's admin_ping (app/routes/
#      admin.py) calls store.persist(...) on the module-level DocStore singleton
#      (app/services/doc_store.py's `store = DocStore(...)`) -- CALLS isn't a
#      gated type in this file (M6 scoped it out of the generic per-type P/R
#      loop, see the top comment above); this ONE record is pinned the SAME way
#      the temporal_start CALLS records below already are -- a dedicated,
#      mechanism-filtered found/golden pair in test_m10_gate.py
#      (`_found_singleton_dispatch`/`_load_golden_singleton_dispatch`, mirrors
#      `_found_temporal_start`/`_load_golden_temporal_start` exactly), NOT the
#      generic GATE_TYPES loop -- resolution/confidence/mechanism are pinned
#      directly against staging by that same gate (this file carries no such
#      fields, same convention as every other entry here).
#
# M9 (task-5, realstack legs): АДДИТИВНОЕ расширение, той же протокол ("verified
# addition", M1b/M2 precedent) -- два новых сечения, каждое задокументировано у
# своей группы ниже:
#   1. external CALLS_HTTP (T1): AuditClient.submit_audit_event (app/clients/
#      audit_client.py) — env-anchored (SERVICE_AUDIT_URL) на РЕАЛЬНЫЙ hostname
#      (audit.ext.prod.env), не именующий НИ ОДНОГО workspace-сервиса —
#      linking/http_routes.py's tier-2a "external" split даёт синтетический канал
#      (owner="?" в id, НЕ ломает форму) с props external=true/external_host,
#      calls_http_external=1 (гейт пинит через `.get()`, счётчик отдельно, не
#      ломает существующие точные dict-сравнения — таковых на link_stats нет).
#   2. multi-mount HANDLES (T3): worker's admin_ping (app/routes/admin.py) —
#      РОВНО двойной mount (`app.include_router(r, prefix="/v1")` +
#      `prefix="/legacy"`, брифом же и заданный) — ДВА канала, ДВА HANDLES на тот
#      же хендлер; изолирован от всей остальной фикстуры (ни один клиент его не
#      вызывает) — ноль сдвига в CALLS_HTTP/trace.
#
# M8 (T3, rerun-2 R4/R5): АДДИТИВНОЕ расширение — САНКЦИОНИРОВАННЫЙ протокол
# верифицированного дополнения (R4's own whole point: композиция префиксов через
# include_router-цепочку — это ИЗМЕНЕНИЕ семантики HTTP-каналов gateway's routes,
# санкция контроллера ЕСТЬ явно в task-3-брифе). Три изменения, каждое
# задокументировано у своей группы ниже:
#   1. gateway restructured: app/routes/__init__.py — новый аггрегатор
#      `api = APIRouter(prefix="/v1")`, включает submit_router+ops_router (ни один
#      без своего префикса); app/main.py — `app.include_router(api, prefix="/api")`.
#      Ни один существующий CALLS/INVOKES_ACTIVITY/CALLS_HTTP/PRODUCES/CONSUMES
#      кортеж НЕ сдвинут (все существующие символы/каналы этого файла — byte-same);
#      worker's routing НЕ тронут (trivial-chain regression: composition сквозь
#      пустой ancestor-prefix воспроизводит byte-same шаблон, как и раньше M8).
#   2. НОВАЯ секция HANDLES (впервые в этом golden — тип не был в скоупе M6/M7-
#      гейтов, но evalx.edges_eval уже поддерживает его нативно, см. её module
#      docstring: staged-направление channel->handler нормализуется в тот же
#      (type, handler_service, handler_symbol, chan_id) кортеж, что и golden
#      src=handler/dst=channel здесь) — прямое, исчерпывающее (P=R=1.0) дока-
#      зательство R4: ВСЕ семь реальных HTTP-роутов фикстуры (4 у gateway —
#      теперь через НЕТРИВИАЛЬНУЮ multi-hop цепочку с ОБОИМИ фиксами R4 —
#      include-kwarg-префикс И aggregator's own декларированный префикс — M8
#      review Important-1; 3 у worker — тривиальный однофайловый случай без
#      цепочки, byte-same, что и до M8) с их composed-каналами напрямую из
#      router_prefix.py (S7), а не старой прямой S5-эмиссией fastapi_ext.py.
#   3. НОВАЯ typed-signal PRODUCES запись (R5): DocActivities.publish_submitted_
#      event шлёт `handle.signal(DocSubmissionWorkflow.doc_approved, ...)` —
#      типизированная ссылка на ТОТ ЖЕ M7 T4 хендлер, резолвится через
#      ref_symbol_lookup (temporal_ext.py M8 T2) + linking/signal_send.py →
#      static/1.0, mechanism=temporal_signal — РЯДОМ с уже существующей
#      строковой cross-service отправкой из worker's DocSubmittedConsumer
#      (heuristic/0.6, не тронута) в тот же канал chan:temporal_signal:
#      doc-approved — оба леga честно резолвлены, ни один не golden-fit.
version: 1
edges:
  # --- gap 3: workflow.start_workflow (route -> workflow) и
  # workflow.start_child_workflow (workflow -> child workflow) --
  # app/routes/submit.py's submit_document + app/workflows/submission.py's
  # DocSubmissionWorkflow.run. Оба резолвятся при извлечении (temporal_ext.py) —
  # S7 (_apply_temporal_start_marks) создаёт CALLS с mechanism=temporal_start.
  - src: {service: gateway, symbol: app.routes.submit.submit_document}
    type: CALLS
    dst: {service: gateway, symbol: app.workflows.submission.DocSubmissionWorkflow.run}
    mechanism: temporal_start
  # --- M10 T1 (task-5) module-level singleton dispatch: worker's admin_ping
  # (app/routes/admin.py) calls store.persist(...) on the module-level DocStore
  # singleton (app/services/doc_store.py's `store = DocStore(...)`) --
  # scip-python cannot trace the attribute access back to DocStore's own
  # persist method through the module-level instance binding
  # (parsing/module_singletons.py's own module docstring; the pilot's #1
  # real-world dropped-CALLS shape, 53% of 149). extractors/calls.py's
  # _try_singleton redirects this to a CALLS edge onto DocStore.persist,
  # resolution=static/1.0 (scip resolves DocStore itself, same-file),
  # props.mechanism="singleton_dispatch" -- pinned DIRECTLY by test_m10_gate.py
  # (mirrors the temporal_start CALLS entry immediately above: a dedicated
  # mechanism-filtered found/golden pair, NOT the generic GATE_TYPES loop --
  # see this file's own top comment).
  - src: {service: worker, symbol: app.routes.admin.admin_ping}
    type: CALLS
    dst: {service: worker, symbol: app.services.doc_store.DocStore.persist}
    mechanism: singleton_dispatch
  - src: {service: gateway, symbol: app.workflows.submission.DocSubmissionWorkflow.run}
    type: CALLS
    dst: {service: gateway, symbol: app.workflows.notify.NotifyWorkflow.run}
    mechanism: temporal_start
  # --- gap 2: workflow.execute_activity_method (bound-method ref) --
  # DocSubmissionWorkflow.run calls both DocActivities methods this way.
  - src: {service: gateway, symbol: app.workflows.submission.DocSubmissionWorkflow.run}
    type: INVOKES_ACTIVITY
    dst: {service: gateway, symbol: app.activities.docs.DocActivities.fetch_document_content}
  - src: {service: gateway, symbol: app.workflows.submission.DocSubmissionWorkflow.run}
    type: INVOKES_ACTIVITY
    dst: {service: gateway, symbol: app.activities.docs.DocActivities.publish_submitted_event}
  # --- gap 1: decorator-SDK HTTP client (route_from/call/verb_from idiom) --
  # DocClient.fetch_document: @path_template("/documents/{doc_uid}") + Request(Method.GET,
  # ...) + self.driver.fetch_content(request) -> resolves to worker's GET /documents/{doc_uid}.
  - src: {service: gateway, symbol: app.clients.doc_client.DocClient.fetch_document}
    type: CALLS_HTTP
    dst: {channel: "chan:http:worker:GET /documents/{doc_uid}"}
  # --- gap 5: producer wrapper (KYCEventPublisher.publish over send_and_wait) --
  # DocActivities.publish_submitted_event calls self._publisher.publish(...); the
  # producer idiom pins event_type=DocSubmittedEvent (const), NOT the dynamic topic_name.
  - src: {service: gateway, symbol: app.activities.docs.DocActivities.publish_submitted_event}
    type: PRODUCES
    dst: {channel: "chan:event_type:DocSubmittedEvent"}
  # --- gap 4: base_class consumer (BaseConsumer[DocSubmittedEvent].process_event) --
  # worker/app/consumers/doc_submitted.py's DocSubmittedConsumer(BaseConsumer[DocSubmittedEvent]);
  # kyc_base_consumer has no installed venv here, so this resolves via the IMPORT_NAME
  # textual tier (resolution=heuristic, confidence=0.6 -- pinned directly by the gate,
  # NOT by this file's format, which carries no confidence field at all).
  - src: {service: worker, symbol: app.consumers.doc_submitted.DocSubmittedConsumer.process_event}
    type: CONSUMES
    dst: {channel: "chan:event_type:DocSubmittedEvent"}
  # --- M7 T2 (OPEN R2) settings-source producer: outbox Event ctor in
  # app/services/outbox_repo.py's add_document_event; идиома outbox-doc-events
  # резолвит имя канала из GatewaySettings.doc_events_topic'а СТРОКОВОГО ДЕФОЛТА
  # ("kyc.document.events", app/config.py) через ClassAttrIndex — call-site не
  # участвует. Матч ctor'а Event — STATIC (scip резолвит first-party класс), а
  # Resolved(kind="value") сохраняет tier как есть -> static/1.0 (пин — в гейте).
  - src: {service: gateway, symbol: app.services.outbox_repo.OutboxRepository.add_document_event}
    type: PRODUCES
    dst: {channel: "chan:kafka_topic:kyc.document.events"}
  # --- M7 T2 (OPEN R2a) enum fan-out: TopicMirror.replicate x2 call-sites в
  # app/routes/ops.py's replay_document; идиома doc-topic-mirror фан-аутит по
  # ВСЕМ членам DocTopicName (app/topics.py) — по одному PRODUCES на член,
  # fixed heuristic/0.8, props {mechanism: enum_fanout, callsite_count: 2}
  # (дедуп двух call-site'ов в одном def'е; пины — в M7-гейте).
  - src: {service: gateway, symbol: app.routes.ops.replay_document}
    type: PRODUCES
    dst: {channel: "chan:kafka_topic:kyc.doc.review"}
    mechanism: enum_fanout
  - src: {service: gateway, symbol: app.routes.ops.replay_document}
    type: PRODUCES
    dst: {channel: "chan:kafka_topic:kyc.doc.audit"}
    mechanism: enum_fanout
  - src: {service: gateway, symbol: app.routes.ops.replay_document}
    type: PRODUCES
    dst: {channel: "chan:kafka_topic:kyc.doc.archive"}
    mechanism: enum_fanout
  # --- M7 T4 (OPEN R3) temporal signal pair: worker consumer шлёт
  # handle.signal("doc-approved", ...) (app/consumers/doc_submitted.py's
  # process_event) -> PRODUCES heuristic/0.6 mechanism=temporal_signal;
  # gateway's @workflow.signal(name="doc-approved") хендлер
  # (app/workflows/submission.py's doc_approved) -> CONSUMES static/1.0.
  # Кросс-сервисный хоп через канал — легальный мост, как kafka/http.
  # @workflow.query approval_state — role-only, НИКАКОГО ребра/канала: его
  # отсутствие здесь + P=R=1.0 по CONSUMES/PRODUCES и есть негативный пин.
  - src: {service: worker, symbol: app.consumers.doc_submitted.DocSubmittedConsumer.process_event}
    type: PRODUCES
    dst: {channel: "chan:temporal_signal:doc-approved"}
    mechanism: temporal_signal
  - src: {service: gateway, symbol: app.workflows.submission.DocSubmissionWorkflow.doc_approved}
    type: CONSUMES
    dst: {channel: "chan:temporal_signal:doc-approved"}
  # --- M8 T3 (rerun-2 R5) same-service TYPED signal pair: DocActivities.
  # publish_submitted_event (app/activities/docs.py) does
  # handle.signal(DocSubmissionWorkflow.doc_approved, doc_uid) -- a typed ref to
  # the SAME M7 T4 handler above, resolved via ref_symbol_lookup (temporal_ext.py
  # M8 T2) and linked (linking/signal_send.py) onto the identical
  # chan:temporal_signal:doc-approved channel the CONSUMES entry above already
  # targets -- static/1.0 (a resolved symbol reference is full ground truth,
  # mirrors INVOKES_ACTIVITY). Two independent PRODUCES into one channel: this
  # entry does NOT replace or shift the pre-existing string-based one above.
  - src: {service: gateway, symbol: app.activities.docs.DocActivities.publish_submitted_event}
    type: PRODUCES
    dst: {channel: "chan:temporal_signal:doc-approved"}
    mechanism: temporal_signal
  # --- M7 T3 (OPEN R1) env->service anchored CALLS_HTTP: StatusClient.fetch_status
  # (app/clients/status_client.py) — auto-anchor self.host = config.worker_url ->
  # field_by_name -> SERVICE_WORKER_URL -> env_values.yaml -> worker; уникальный
  # строгий form-match на GET /api/v1/status/{doc_uid} -> static/1.0 (пин — в
  # гейте). Воронка-негатив: worker's GET /{a}/{b}/{c}/misc НЕ получает НИ ОДНОГО
  # CALLS_HTTP (старое двунаправленное правило сматчило бы {doc_uid} с "misc") —
  # гейт assert'ит ноль рёбер в этот канал, а P=1.0 по CALLS_HTTP держит это же
  # структурно (записи для misc-канала здесь НЕТ).
  - src: {service: gateway, symbol: app.clients.status_client.StatusClient.fetch_status}
    type: CALLS_HTTP
    dst: {channel: "chan:http:worker:GET /api/v1/status/{doc_uid}"}
  # --- M8 T3 (rerun-2 R4) HANDLES: every real HTTP route in the fixture, keyed by
  # its FULLY COMPOSED channel id (router_prefix.py, S7 -- fastapi_ext.py, S5, no
  # longer builds these directly). golden src=handler/dst=channel is the format
  # edges_eval already documents for HANDLES (its staged direction is reversed,
  # channel->handler -- found_edges normalizes it to this same shape, see that
  # module's docstring); P=R=1.0 here is therefore a DIRECT, exhaustive proof that
  # composition produced the byte-exact channel id for every route, not merely
  # that route_prefix_unresolved stayed 0 (which would only prove "SOME confident
  # template was computed", not that it is the CORRECT one).
  #   - gateway (app/routes/submit.py, app/routes/ops.py): NEITHER leaf router
  #     declares its own prefix; app/routes/__init__.py's aggregator `api` DOES
  #     ("/v1", a router_decl claim); app/main.py mounts `api` under the
  #     include-kwarg prefix "/api" -- composed template = "/api" + "/v1" +
  #     <local path>, exercising BOTH halves of the R4 fix (include-kwarg prefix
  #     AND the aggregator's own separately-declared prefix, M8 review
  #     Important-1) in one real, multi-hop, cross-file chain.
  #   - worker (app/routes/documents.py): UNCHANGED trivial single-file, no-
  #     prefix, no-chain case -- composed template equals today's LOCAL template
  #     byte-for-byte (empty ancestor prefix), the regression pin proving the S5
  #     -> S7 relocation of Channel/HANDLES construction didn't shift the common
  #     case. Includes the funnel-negative route itself (misc_catch_all) -- it
  #     legitimately HANDLES exist as a channel (the M7 gate's own vacuity guard
  #     already relies on this), it must simply never receive a CALLS_HTTP edge.
  - src: {service: gateway, symbol: app.routes.submit.submit_document}
    type: HANDLES
    dst: {channel: "chan:http:gateway:POST /api/v1/submit"}
  - src: {service: gateway, symbol: app.routes.ops.submit_decision}
    type: HANDLES
    dst: {channel: "chan:http:gateway:POST /api/v1/documents/{doc_uid}/decision"}
  - src: {service: gateway, symbol: app.routes.ops.replay_document}
    type: HANDLES
    dst: {channel: "chan:http:gateway:POST /api/v1/documents/{doc_uid}/replay"}
  - src: {service: gateway, symbol: app.routes.ops.document_status}
    type: HANDLES
    dst: {channel: "chan:http:gateway:GET /api/v1/status/{doc_uid}"}
  - src: {service: worker, symbol: app.routes.documents.get_document}
    type: HANDLES
    dst: {channel: "chan:http:worker:GET /documents/{doc_uid}"}
  - src: {service: worker, symbol: app.routes.documents.get_document_status}
    type: HANDLES
    dst: {channel: "chan:http:worker:GET /api/v1/status/{doc_uid}"}
  - src: {service: worker, symbol: app.routes.documents.misc_catch_all}
    type: HANDLES
    dst: {channel: "chan:http:worker:GET /{a}/{b}/{c}/misc"}
  # --- M9 T3 (task-5) multi-mount: admin_ping (app/routes/admin.py) is mounted
  # TWICE from app/main.py (prefix="/v1" AND prefix="/legacy") -- both are
  # legitimately live per real FastAPI semantics, so BOTH channels get a HANDLES
  # onto the SAME handler (linking/router_prefix.py's own per-mount composition,
  # M9 T3). Isolated route -- no client anywhere in the fixture calls it.
  - src: {service: worker, symbol: app.routes.admin.admin_ping}
    type: HANDLES
    dst: {channel: "chan:http:worker:GET /v1/ping"}
  - src: {service: worker, symbol: app.routes.admin.admin_ping}
    type: HANDLES
    dst: {channel: "chan:http:worker:GET /legacy/ping"}
  # --- M9 T1 (task-5) external CALLS_HTTP: AuditClient.submit_audit_event
  # (app/clients/audit_client.py) -- anchored via SERVICE_AUDIT_URL (env_values.
  # yaml), a REAL hostname (audit.ext.prod.env) naming NO workspace service.
  # linking/http_routes.py's tier-2a "external" split: still an unresolved
  # synthetic owner="?" channel (id form UNCHANGED, heuristic/0.5 -- "no unearned
  # confidence"), but props additively carry external=true/external_host, and
  # link_workspace's own calls_http_external counter (NOT calls_http_unresolved)
  # counts it -- pinned directly by the gate, not by this file's format (which
  # carries no props/confidence field at all, same convention as every other
  # entry here).
  - src: {service: gateway, symbol: app.clients.audit_client.AuditClient.submit_audit_event}
    type: CALLS_HTTP
    dst: {channel: "chan:http:?:POST /audit/events"}
# channels: block is documentation only (mirrors fixtures/golden/edges.yaml's own
# convention) -- nothing in evalx reads it; the gate hardcodes both channel ids via
# core.ids.chan_kafka/chan_event and checks the CONTAINS pair directly against staging.
channels:
  - id: "chan:kafka_topic:${self.config.topic}"
    contains: ["chan:event_type:DocSubmittedEvent"]
  # M7: new channels, for the record (nothing reads this block): the settings-source
  # topic (kyc.document.events), the three enum fan-out topics (kyc.doc.review/
  # audit/archive), the temporal signal (chan:temporal_signal:doc-approved), and the
  # two new worker http routes (GET /api/v1/status/{doc_uid}; the misc funnel route
  # exists as a Channel but must have ZERO CALLS_HTTP into it).
  # M8: gateway's own four http_route channels are now composed with a real "/api/v1"
  # prefix (see the HANDLES section above) instead of bare local paths; worker's own
  # three channels are unchanged. The typed-signal PRODUCES entry above shares the
  # SAME chan:temporal_signal:doc-approved channel the string-based one already used
  # -- no new channel identity, two independent producers into it.
  # M9 (task-5): TWO new worker channels (admin_ping's double-mount, /v1/ping +
  # /legacy/ping) and ONE new synthetic external channel (chan:http:?:POST
  # /audit/events, AuditClient.submit_audit_event) -- see the HANDLES/CALLS_HTTP
  # sections above.
