# Эталонный трейс для fixtures/realstack (M6 T5; расширен M7 T6). Формат — как
# fixtures/golden/traces.yaml (посегментное сравнение, см. tests/eval/
# test_m6_gate.py's `_trace_diff`, портированный из test_m2_gate.py).
#
# Async-хопы (route -> workflow -> activity -> publish -> event-канал ->
# process_event; и decorator-SDK-вызов -> CALLS_HTTP -> worker-роут) сворачиваются
# в сегменты по "folding"-правилу M2's golden trace (см. его комментарий):
# route/workflow/activity/publish/SDK-вызов все читаются через
# CALLS/INVOKES_ACTIVITY (intra-edge типы) из ОДНОГО entry (submit_document), поэтому
# они остаются ШАГАМИ внутри сегмента 1, а не отдельными сегментами -- граница
# сегмента возникает ТОЛЬКО на PRODUCES/CALLS_HTTP (exit-рёбра). Сегмент 1 несёт ДВА
# exit'а (CALLS_HTTP в worker's route; PRODUCES в event-канал) -> ДВЕ следующих записи
# в очереди -> сегменты 2 и 3 (порядок в этом файле — не позиционный контракт, гейт
# сравнивает МНОЖЕСТВОМ (service, entry_symbol, via_channel) троек, см. _trace_diff).
#
# M7 T6 — ЧЕСТНОЕ ОБНОВЛЕНИЕ M6-golden'а по протоколу брифа («верифицированное
# дополнение», прецедент M1b/M2; санкция контроллера в самом брифе T6: «сигнальный
# хоп в трейсе... M6-трасса либо держится, либо честно обновляется»): фикстура
# ЛЕГИТИМНО выросла на четвёртый async-хоп, достижимый из ТОГО ЖЕ entrypoint'а —
# worker's process_event (сегмент 3) теперь шлёт handle.signal("doc-approved")
# обратно в gateway's DocSubmissionWorkflow.doc_approved (M7 T4, OPEN R3) ->
# сегмент 3 получает PRODUCES-exit в chan:temporal_signal:doc-approved -> ЧЕТВЁРТЫЙ
# сегмент. Прежние три сегмента байт-в-байт нетронуты — расширение аддитивно;
# M6-гейт читает этот же файл и остаётся зелёным, т.к. фикстура и golden выросли
# согласованно (его count/set-сравнение теперь проверяет 4 сегмента).
# M8 T3: entrypoint selector updated from "gateway:POST /submit" to
# "gateway:POST /api/v1/submit" -- gateway's OWN restructured routing (composed via
# a real cross-file include_router chain, R4) changes the route's full template; the
# segments themselves are UNCHANGED (entry symbols are qualified names, not route
# templates, and every via_channel here after segment 1 names a WORKER route, whose
# routing is untouched -- see fixtures/realstack/golden/edges.yaml's own M8 header
# for the full rationale). The new typed-signal producer (DocActivities.
# publish_submitted_event, app/activities/docs.py) feeds into the SAME
# chan:temporal_signal:doc-approved channel/entry segment 4 already names below --
# verified via tests/eval/test_m8_gate.py's own direct segment-1-exit check
# (_typed_signal_hop_diff), since this file's own set-of-triples comparison can't
# distinguish "one producer" from "two producers into the identical channel".
version: 1
traces:
  - entrypoint: "gateway:POST /api/v1/submit"
    segments:
      - service: gateway
        entry: {symbol: app.routes.submit.submit_document}
        via_channel: null
      - service: worker
        entry: {symbol: app.routes.documents.get_document}
        via_channel: "chan:http:worker:GET /documents/{doc_uid}"
      - service: worker
        entry: {symbol: app.consumers.doc_submitted.DocSubmittedConsumer.process_event}
        via_channel: "chan:event_type:DocSubmittedEvent"
      # M7 T4: сигнальный хоп — worker consumer -> (temporal_signal канал) ->
      # gateway workflow's явный @workflow.signal(name="doc-approved") хендлер.
      - service: gateway
        entry: {symbol: app.workflows.submission.DocSubmissionWorkflow.doc_approved}
        via_channel: "chan:temporal_signal:doc-approved"
