# realstack: synthetic fixture proving all FIVE pilot idiom gaps end-to-end (M6
# T5; see docs/superpowers/reports/2026-07-23-pilot-real-services-gaps.md). Two
# independent-domain mini-services (gateway, worker) linked ONLY via Channel
# boundaries -- cross-service linkage goes through event_type identity, never a
# shared literal Kafka topic (GAPS §6's conclusion: producer and consumer match
# on the event's TYPE, not on a topic string, because the real topic is a
# dynamic runtime value on both ends of this stack).
#
# M7 (open-gaps R1-R3, see docs/superpowers/reports/2026-07-23-pilot-rerun-open-
# gaps.md) extends the SAME fixture additively with every M7 mechanism: settings-
# source + enum-fan-out producer topics (T1/T2), env_sources + self.host
# auto-anchoring + strict path matching incl. the funnel NEGATIVE (T3), temporal
# signal channels (T4), request_ctor "|"-alternatives (T5). The M6 gate keeps
# running over this extended fixture unchanged in spirit -- every M6 leg is intact.
version: 1
graph_name: realstack
# M7 T3 (OPEN R1): helm-values-shaped env->URL file; linking/env_map.py turns it
# into an env->service map (SERVICE_WORKER_URL -> worker via the URL hostname's
# first DNS label) -- the ADDITIVE fallback anchoring tier, consulted only when no
# ServiceConfig.http.base_url_env claims the env (none does for SERVICE_WORKER_URL,
# unlike WORKER_URL below, which the worker service's own http: block registers).
env_sources:
  - ./env_values.yaml
services:
  - name: gateway
    path: ./services/gateway
    http: { base_url_env: GATEWAY_URL }
    idioms:
      producers:
        # Gap 5: business-level wrapper over aiokafka's send_and_wait -- topic_name
        # is a dynamic argument (no literal to resolve statically), so this idiom
        # pins event_type instead (the documented manual fallback, T4); NO topic:
        # field here at all -- there genuinely is no static topic identity on the
        # producer side of this stack.
        - name: kyc-event-publisher
          call: "app.services.publisher.KYCEventPublisher.publish"
          channel:
            kind: event_type
            event_type_from: { const: "DocSubmittedEvent" }
        # M7 T2 (OPEN R2) settings-source leg: outbox Event ctor is the producer
        # call-site; its topic ARGUMENT is a Settings attribute (dynamic at the
        # call-site), so the channel identity comes from the Settings class's own
        # string-literal field default via the service-wide ClassAttrIndex --
        # "<ClassFQN>.<field>", no call-site resolution involved at all. A literal
        # default -> a real static-quality identity (edge keeps the call match's
        # own tier, static/1.0 here).
        - name: outbox-doc-events
          call: "app.models.outbox.Event"
          channel:
            kind: kafka_topic
            name_from: { settings: "app.config.GatewaySettings.doc_events_topic" }
        # M7 T2 (OPEN R2a) enum fan-out leg: replicate's topic is runtime data,
        # but the POSSIBLE topics are the DocTopicName StrEnum's members -- the
        # idiom declares the whole enum and kafka_ext emits one PRODUCES per
        # member (fixed heuristic/0.8, mechanism=enum_fanout, callsite_count-
        # deduped per (src, dst)) -- a documented, honest over-approximation.
        - name: doc-topic-mirror
          call: "app.services.mirror.TopicMirror.replicate"
          channel:
            kind: kafka_topic
            name_from: { enum: "app.topics.DocTopicName" }
      http_clients:
        # Gap 1: decorator-route HTTP client SDK -- path lives in @path_template,
        # verb in Request(Method.X, ...), the call itself behind driver indirection.
        - name: doc-client-decorator-sdk
          file_glob: "**/clients/doc_client.py"
          class_glob: "*Client"
          base_url: { env: WORKER_URL }
          route_from: { decorator: "path_template", arg: 0 }
          call: "driver.fetch_content"
          verb_from: { request_ctor: "Request", enum: "Method" }
        # M7 T3 auto-anchor + T5 request_ctor alternatives: NO base_url on purpose
        # -- the target service is recovered from StatusClient's OWN
        # `self.host = config.worker_url` ctor assignment (host_attr defaults to
        # "host"), joined through ClassAttrIndex.field_by_name -> SERVICE_WORKER_URL
        # -> env_sources map -> worker. The verb ctor is the ProxyRequest
        # subclass, matched only via the "|"-alternatives spelling (T5).
        - name: status-client-proxy-sdk
          file_glob: "**/clients/status_client.py"
          class_glob: "*Client"
          route_from: { decorator: "path_template", arg: 0 }
          call: "driver.fetch_content"
          verb_from: { request_ctor: "Request|ProxyRequest", enum: "Method" }
        # M9 T1 realstack leg: same decorator-SDK convention as doc-client-
        # decorator-sdk, base_url anchored directly (like WORKER_URL there) --
        # except SERVICE_AUDIT_URL resolves to a REAL hostname that names NO
        # workspace service (env_values.yaml) -> tier-2a "external" split.
        - name: audit-client-decorator-sdk
          file_glob: "**/clients/audit_client.py"
          class_glob: "*Client"
          base_url: { env: SERVICE_AUDIT_URL }
          route_from: { decorator: "path_template", arg: 0 }
          call: "driver.fetch_content"
          verb_from: { request_ctor: "Request", enum: "Method" }
  - name: worker
    path: ./services/worker
    http: { base_url_env: WORKER_URL }
    idioms:
      consumers:
        # Gap 4: shared-lib BaseConsumer[Event] subclass -- process_event (NOT
        # ctor/setup) is the business handler; event_type comes from the generic
        # argument (a stable static identity), not the dynamic per-env topic.
        # topic.attr is OPTIONAL (config/models.py) -- included here to ALSO pin
        # the honest-unresolved-topic + CONTAINS(topic -> event) path: kyc_base_consumer
        # is a path-dependency with no installed venv (see fixtures/realstack/libs/
        # kyc_base_consumer), so scip cannot resolve the base class reference --
        # IMPORT_NAME textual tier fires instead (resolution=heuristic,
        # confidence=0.6), exactly like the real pilot's own shared-lib gap.
        - name: doc-submitted-base-class
          kind: base_class
          base_class: "kyc_base_consumer.base.BaseConsumer"
          handler_method: "process_event"
          event_type_from: { generic_arg: 0 }
          topic: { attr: "self.config.topic" }
builtin_idioms: [fastapi, aiokafka, faststream, confluent, temporal, aiohttp_client]
processes:
  # M8 T3: entrypoint selector updated for gateway's own restructured routing
  # (app/routes/__init__.py's aggregator "/v1" + app/main.py's include-kwarg "/api"
  # -> composed "/api/v1/submit") -- the pre-M8 selector no longer resolves any
  # staged route once router_prefix.py (S7) builds the Channel(http_route) from the
  # FULLY composed template instead of the bare local one.
  - name: "Document submission"
    entrypoint: "gateway:POST /api/v1/submit"
