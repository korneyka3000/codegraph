[project]
name = "codegraph"
version = "0.1.0"
description = "Code knowledge graph RAG for Python microservices: CLI indexer + MCP server"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "protobuf>=7.35,<8",
    "falkordb>=1.0.10",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pathspec>=0.12",
    "fastmcp>=2.14,<3",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[project.optional-dependencies]
local-emb = [
    "sentence-transformers>=5.6.0",
    "transformers<5",
]
openai = [
    "openai>=2.45.0",
]
voyage = [
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "grpcio-tools>=1.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not scip and not emb'"
markers = [
    "falkordb: requires a running FalkorDB instance (docker compose up -d)",
    "scip: needs node/npx and network (runs real scip-python)",
    "emb: requires an optional embedding provider package (uv sync --extra local-emb/openai/voyage)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "fixtures",  # код-как-данные для индексации, не линтим
    "src/codegraph/resolvers/scip/scip_pb2.py",  # generated protobuf, не форматируем
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
