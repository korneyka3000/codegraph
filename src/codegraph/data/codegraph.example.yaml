# codegraph workspace config.
# Реестр сервисов (локальные чекауты) + идиомы producer/consumer/http-client.
# Идиомы — данные: опишите свой outbox/диспатчер здесь, код менять не нужно.
# Документация полей: docs/superpowers/specs/2026-07-12-codegraph-design.md

version: 1
graph_name: kyc
storage: { falkordb: { host: localhost, port: 6379 } }
embedding: { provider: local, model: jinaai/jina-embeddings-v2-base-code }
# embedding.query_prefix/passage_prefix (опционально, "" по умолчанию у обеих --
# no-op): инструкции, которые некоторые local-модели ждут перед текстом, чтобы
# отличить поисковый запрос от индексируемого пассажа -- напр. канонические
# intfloat/multilingual-e5-* принимают query_prefix: "query: ", passage_prefix:
# "passage: " (см. README «Ограничения», рекомендация для русскоязычных команд).
# Читает только provider: local.
scip: { timeout_min: 20, node_options: "--max-old-space-size=8192" }
# env_sources (M7, опционально): helm-values-образные YAML с env→URL маппингами —
# дают env→service карту-ФОЛБЭК для якорения CALLS_HTTP (linking/env_map.py):
# берётся hostname'ов ПЕРВЫЙ DNS-лейбл и сверяется с именами сервисов workspace'а
# (точное равенство, без фаззи). Консультируется ТОЛЬКО когда ни один
# services[].http.base_url_env (первичный реестр) не владеет env-переменной claim'а.
# Пути — относительно самого yaml; несуществующий путь — ошибка загрузки конфига.
# env_sources:
#   - ./deploy/values.yaml        # напр.: SERVICE_ORDERS_URL: "http://orders-api.ns.svc:8000"

services:
  - name: orders-api
    path: ../orders-api          # локальный чекаут
    python: .venv                # venv для scip-python (autodetect)
    exclude: ["tests/**", "alembic/**"]
    http: { base_url_env: ORDERS_API_URL }   # так другие сервисы находят этот
    idioms:
      producers:
        - name: outbox                                   # кастомный outbox-идиом — чисто данные
          call: "app.db.outbox.OutboxRepository.add_event"
          channel:
            kind: event_type
            event_type_from: { arg: 0 }                  # или {kwarg: event_type}
            topic: { const: "orders.events" }            # → CONTAINS topic→event_type
        - name: kafka-kwarg-topic                         # топик передан как KWARG, не позиционно
          call: "app.events.kafka.RawProducer.send_and_wait"
          channel:
            kind: kafka_topic
            name_from: { kwarg: "topic" }                # builtin-идиом ждёт arg0 — здесь topic=X
        - name: event-publisher-wrapper                  # producer — бизнес-обёртка над низкоуровневым
                                                          # send_and_wait(topic=X, ...); топик там сам
                                                          # kwarg И часто динамический (напр. атрибут
                                                          # payload.topic_name — не резолвится статически,
                                                          # см. docs/superpowers/reports/
                                                          # 2026-07-23-pilot-real-services-gaps.md §6) —
                                                          # честный ручной вариант при фиксированном типе
                                                          # события на этой точке вызова: фиксируем
                                                          # event_type константой вместо топика
          call: "app.services.producer.EventPublisher.publish"
          channel:
            kind: event_type
            event_type_from: { const: "OrderShipped" }
        - name: outbox-settings-topic                    # M7: топик из pydantic-Settings поля —
                                                          # "<ClassFQN>.<field>" (суффикс-матч по FQN
                                                          # класса); строковый ДЕФОЛТ поля -> статичная
                                                          # идентичность канала (call-site не участвует);
                                                          # без дефолта, но с env-именем (env_prefix/alias)
                                                          # -> честный config_ref-плейсхолдер, как {env:}.
          call: "app.db.outbox.Event"
          channel:
            kind: kafka_topic
            name_from: { settings: "app.config.ServiceSettings.orders_topic" }
        - name: topic-family-mirror                      # M7: enum-фан-аут — топик вызова динамический,
                                                          # но СЕМЕЙСТВО возможных топиков — члены
                                                          # Enum/StrEnum-класса: по одному PRODUCES на член
                                                          # (fixed heuristic/0.8, mechanism=enum_fanout,
                                                          # дедуп повторных call-site'ов через
                                                          # callsite_count) — документированная честная
                                                          # оверап-проксимация. enum допустим ТОЛЬКО в
                                                          # name_from kafka_topic-канала (везде ещё —
                                                          # ошибка конфига, fail-closed).
          call: "app.services.mirror.TopicMirror.replicate"
          channel:
            kind: kafka_topic
            name_from: { enum: "app.topics.OrderTopicName" }
  - name: kyc-worker
    path: ../kyc-worker
    idioms:
      consumers:
        - name: dispatch-map                             # диспатч по dict[event_type → handler]
          kind: dispatch_dict
          registrar_call: "app.consumers.base.register_handlers"
          topic: { const: "orders.events" }
          event_type_from: dict_key
        - name: shared-lib-consumer                       # подкласс базового класса из shared-lib
                                                            # (`class Consumer(BaseConsumer[FooEvent])`,
                                                            # см. docs/superpowers/reports/
                                                            # 2026-07-23-pilot-real-services-gaps.md §4) —
                                                            # бизнес-обработчик — ОВЕРРАЙД handler_method
                                                            # (не ctor/setup), event_type — из
                                                            # generic-параметра базового класса (стабильная
                                                            # статическая идентичность), а не из топика
                                                            # (часто динамический). topic.attr — опционально:
                                                            # даёт честный unresolved-канал + CONTAINS
                                                            # topic→event, если топик — конфиг-атрибут, а не
                                                            # литерал (поддерживает ТОЛЬКО {attr: ...} — нет
                                                            # call-сайта, чтобы резолвить const/arg/kwarg/env).
          kind: base_class
          base_class: "shared_consumer_base.BaseConsumer"
          handler_method: "process_event"
          event_type_from: { generic_arg: 0 }              # BaseConsumer[FooEvent] → "FooEvent"
          topic: { attr: "self.config.topic" }
      http_clients:
        - name: default-sdk                              # уточнение builtin-конвенции *Client
          file_glob: "**/clients/*_client.py"
          class_glob: "*Client"
          base_url: { attr: "self._base_url", env: DOCUMENT_MANAGEMENT_URL }
          # M7-альтернативы якорения (явное всегда бьёт авто):
          #   base_url: { settings: "app.config.ServiceSettings.docs_url" } — env-имя
          #     поля (env_prefix/alias) из ClassAttrIndex, per-class, без коллизий;
          #   БЕЗ base_url вовсе — auto-anchor: `self.<host_attr> = <chain>` в теле
          #     САМОГО класса (наследованный из базового ctor'а — НЕ виден,
          #     задокументированное ограничение), хвост RHS джойнится по имени на
          #     УНИКАЛЬНОЕ env-носящее Settings-поле сервиса; коллизия/без-env —
          #     честно без якоря (unanchored unique — heuristic/0.7, НИКОГДА не
          #     static/1.0 без якоря).
          # host_attr: "host"                            # имя атрибута для auto-anchor (дефолт "host")
        - name: decorator-route-sdk                       # альтернативная SDK-конвенция: маршрут — в
                                                            # декораторе (не arg0 самого HTTP-вызова), verb —
                                                            # из Request(Method.X, ...), сам вызов — за
                                                            # driver-индирекцией (см. §2 отчёта выше). Поля
                                                            # route_from/call/verb_from — все-или-ничего
                                                            # (config/models.py); при заданном route_from
                                                            # экстрактор переключается в этот режим целиком,
                                                            # verb-режим (get/post/…-callee + arg0=URL) выше
                                                            # не участвует.
          file_glob: "**/clients/*_client.py"
          class_glob: "*Client"
          base_url: { env: DOCUMENT_MANAGEMENT_URL }
          route_from: { decorator: "path_template", arg: 0 }  # @path_template("/v1/x/{id}")
          call: "driver.fetch_content"                        # "a.b|c.d" — "|"-альтернативы допустимы
          verb_from: { request_ctor: "Request|ProxyRequest", enum: "Method" }
                                                            # Request(Method.GET, ...); M7: "|"-альтернативы
                                                            # для сабклассов-конструкторов (ProxyRequest(
                                                            # Request) в реальном SDK) — пустая альтернатива
                                                            # ("Request|") отклоняется на загрузке.
  - name: document-management
    path: ../document-management
    http: { base_url_env: DOCUMENT_MANAGEMENT_URL }      # builtin-идиом достаточно

builtin_idioms: [fastapi, aiokafka, faststream, confluent, temporal, aiohttp_client]
processes:
  - name: "Order KYC onboarding"
    entrypoint: "orders-api:POST /orders"
