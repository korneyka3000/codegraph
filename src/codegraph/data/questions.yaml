# Golden retrieval questions for the M3 gate (tests/eval/test_m3_gate.py) and for
# `codegraph eval retrieval` (src/codegraph/cli.py) -- 5 natural-language questions
# from the M3 plan (docs/superpowers/plans/2026-07-15-m3-retrieval.md, Task 8), plus
# ONE added question 6 (M3 final whole-milestone review, fulltext-coverage fix -- see
# "QUESTION 6" section below), run through GraphQuery.search_code(mode="hybrid")
# (fulltext + REAL jina-embeddings-v2-base-code, RRF-fused) against the
# fixtures/workspace.yaml graph; hit@k = ANY item in the top `k` whose
# (service, qualified_name) is in that question's `accept` set.
#
# Format: {question, accept: [{service, symbol}], k}. `accept` is an OR-set --
# hit if ANY entry matches ANY top-k item (see evalx/retrieval_eval.run_questions).
#
# VERIFICATION POLICY (binding, M3 T8 brief): every `accept` entry below was checked
# against the ACTUAL fixture code AND the real T3/T4 chunking/retrieval pipeline
# BEFORE this file was written -- not copied verbatim from the plan doc's own
# suggested accept lists, which predate the chunker's exact grouping behavior. Two
# corrections were required (documented below); a third change is a ONE-TIME human
# rephrase of a question that missed hit@3 on the real model (also documented) --
# per the brief's anti-curve-fit rule, accept lists are NEVER widened to match
# whatever the model's actual top-k happened to return.
#
# CORRECTION 1 (questions 1 and 4): the plan's draft accept lists named METHODS
# (`OrderService.place`, `DocumentManagementClient.get_document`/`.create_document`)
# as the expected hit. Real symbols, yes (python_core.py builds a Node for every
# def) -- but NOT independently retrievable chunks: `chunking/splitter.py` rule 2
# ("a class that fits within max_chars becomes exactly ONE chunk under its own
# symbol_id -- methods are NOT split out") applies to every class in these fixtures
# (OrderService, DocumentManagementClient, KycWorkflow are all well under the
# 2000-byte default), confirmed both by chunking/augment.py's own docstring ("T3's
# own report: none of the 29 fixture files split, every class/function chunks
# whole") and empirically by running the real pipeline (analyze x3 real scip ->
# link -> chunk_embed with the real embedder) and inspecting the resulting
# (chunk_id, symbol_id, qualified_name) rows directly: OrderService.place's code
# lives in a chunk whose qualified_name is `app.services.order.OrderService` (the
# CLASS), never `.place` on its own -- same story for DocumentManagementClient's two
# methods, one chunk, qualified_name = the class. `accept` below names the class for
# both questions instead. (KycWorkflow, question 3, needed NO correction -- the
# plan's draft already named the class there, not `.run`.)
#
# CORRECTION 2 (question 5, ONE documented rephrase, per the brief's "max 1
# rephrase per question" allowance): the plan's original wording --
#   "где публикуется событие о проиндексированном документе"
# -- missed hit@3 on the real model (jina-embeddings-v2-base-code is an
# English-centric CODE embedding model; its cross-lingual match for the Russian
# passive participle "проиндексированном" was weak enough that
# `emit_document_indexed` didn't surface in the top 5 at all, let alone top 3 --
# verified live, not assumed). Rephrased to name the Kafka topic literally:
#   "где публикуется kafka-событие documents.indexed"
# -- a realistic question from an engineer who already knows the topic name from
# Kafka tooling/logs and wants to find the producer code, and stylistically
# consistent with question 2's OWN unchanged wording (which already names the
# `OrderCreated` event type literally rather than describing it). Verified live:
# `emit_document_indexed` is the #1 hybrid result for the rephrased wording (was:
# absent from the top 5 for the original wording). No other question needed a
# rephrase -- questions 1-4 all hit@3 on the FIRST (plan-original) wording once
# their accept lists reflected the real chunk granularity (correction 1).
#
# FULLTEXT-COVERAGE DISCLOSURE (M3 final whole-milestone review carry-item --
# HISTORICAL: written when the fulltext leg was implicit-AND ONLY; partially
# superseded by the OR-FALLBACK section below): questions 1-5 are all Russian
# natural-language questions over an English-identifier codebase. Live-verified
# (mode="text", fulltext only, no vector, PRE-OR-fallback): EVERY ONE of questions
# 1-5 returned ZERO fulltext hits -- RediSearch's `db.idx.fulltext.queryNodes` runs
# an implicit-AND over the query's tokens (see stores/falkordb/store.py's
# `_sanitize_fulltext_query`), none of a Russian question's Cyrillic tokens ever
# literally appears in this corpus's (English-identifier) chunk text/context_header,
# and under AND a single missing token zeroes the whole query. So UNDER AND-ONLY,
# `mode="hybrid"` on questions 1-5 was in practice vector-only -- every "hit" in the
# M3-close History ranks below came entirely from jina-embeddings-v2-base-code's
# cross-lingual semantic match, and a hybrid gate with 5/5 questions silently
# exercising only one of its two legs never actually proved the fulltext leg (or
# its RRF fusion with vector) worked -- the gap question 6 was added to close.
# CURRENT TRUTH (M4 T3, measured per-question via store.search_text_chunks against
# a freshly built real-pipeline graph, see .superpowers/sdd/task-3-report.md): only
# question 3 is genuinely all-Cyrillic-token and still gets zero fulltext
# candidates (vector-only in practice, in either AND or OR mode); questions 1/2/4/5
# each carry at least one literally-matching identifier token (Q1 "outbox"; Q2
# "OrderCreated"; Q4 "document"/"management"/"http"; Q5 "kafka"/
# "documents.indexed") and now get a REAL fulltext leg via the OR-fallback
# (question 6 always had one under plain AND, no fallback needed).
#
# QUESTION 6 (M3 final whole-milestone review, fulltext-coverage fix): added
# specifically to close the gap above -- an English, identifier-style query (the
# literal Kafka topic name `documents.indexed` + the word "producer"), chosen and
# verified live, the same anti-curve-fit discipline as questions 1-5:
#   - `store.search_text_chunks("documents.indexed producer", k=5)` (fulltext ALONE,
#     zero vector/embedder involvement) returns exactly ONE hit, unambiguous:
#     `app.events.producer.emit_document_indexed`'s own chunk (RediSearch score 4.8 --
#     both query tokens literally appear in that chunk's context_header/text, no other
#     chunk in the 34-chunk corpus matches either token). This is the load-bearing
#     proof: fulltext genuinely, independently finds the right answer for this
#     question, not just "rides along" with a vector hit that would land there anyway.
#   - `mode="text"`, `mode="vector"`, AND `mode="hybrid"` (`GraphQuery.search_code`)
#     were each run live and all three land `emit_document_indexed` at rank 0 -- the
#     fulltext leg is not merely present, it independently solves this question on its
#     own, same as the vector leg does for questions 1-5.
# No rephrase needed -- unlike question 5, the FIRST wording tried already hit@3
# (in fact hit@1) in every mode.
#
# OR-FALLBACK (M4 T3): store.search_fulltext/store.search_text_chunks
# (stores/falkordb/store.py) now retry a query whose first (implicit-AND) pass
# returns zero rows by re-running it with its tokens OR-joined, when the sanitized
# query has more than one token (see _fulltext_result_set's own docstring for the
# full mechanism/rationale). Practical effect for THESE golden questions: a mixed
# RU/EN question now gets real text-leg (fulltext) candidates whenever AT LEAST ONE
# of its tokens is a literal match somewhere in this English-identifier corpus --
# the text leg is no longer unconditionally dead for every mixed-language question
# the way the FULLTEXT-COVERAGE DISCLOSURE above (M3-era, pre-T3) describes. A
# genuinely ALL-Cyrillic question (every token non-matching) is unaffected -- OR of
# all-misses is still a miss, so it stays vector-only exactly as before.
#
# M4 T3 GATE RE-RUN FINDING (delta, reported per this task's brief; reviewed and
# ACCEPTED by the coordinator -- the plan's "questions 1-5 are pure-Cyrillic"
# premise was simply false, and the fallback legitimately revived the text leg):
# re-running this gate after the OR-fallback above (full detail:
# .superpowers/sdd/task-3-report.md) found that questions 1, 2, 4, and 5 each
# actually contain at least one token that DOES literally match this corpus (the
# per-question token list lives in CURRENT TRUTH, disclosure section above) --
# live-verified via store.search_text_chunks; only question 3 is genuinely
# all-Cyrillic-token. Consequently the OR-fallback now injects real text-leg
# candidates into hybrid RRF fusion for questions 1/2/4/5, not just question 6 as
# the M3-era disclosure anticipated. hit@3 remains 6/6 (gate still green, no
# pass/fail regression) but per-question hybrid RANKS shifted versus the M3-close
# baseline (now the History line in the REAL GATE RESULTS block below): question 1
# rank 1->2, question 2 rank 2->1, question 4 rank 2->0; questions 3, 5, 6
# unchanged -- a net improvement, with the one worsening (question 1) still
# comfortably inside k=3. Per the coordinator's decision (honest-gates path:
# golden documentation reflects measured reality; the hit@3 threshold itself is
# untouched), the block below now LEADS with the current measured snapshot and
# demotes the M3-close numbers to a History line.
#
# M12 T1 GATE RE-RUN FINDING (delta, reported per this task's brief -- pool
# over-fetch side effect, NOT symbol-aggregation itself; see .superpowers/sdd/
# task-1-report.md for the full A/B measurement): query/retrieval.py's search_code
# now aggregates post-RRF candidates by symbol_id (top-k becomes k DISTINCT symbols,
# each represented by its best-ranked chunk -- see that module's own docstring) and,
# to give aggregation real headroom, over-fetches each leg (text AND vector) to
# `k * _SEARCH_POOL_FACTOR` (=12 for this gate's k=3) chunks instead of a bare k.
# Every symbol in THIS fixture corpus maps to exactly one chunk (chunking/
# splitter.py rule 2 -- no class here is big enough to split, see CORRECTION 1
# above), so aggregation itself is a proven no-op on this graph (pinned unit test:
# tests/unit/test_retrieval.py::
# test_search_code_all_unique_symbols_output_unchanged_from_pre_aggregation_shape).
# The pool over-fetch is NOT a no-op, though: with only 34 chunks total, asking each
# leg for 12 instead of 3 candidates measurably widens cross-list overlap before RRF
# fusion. hit@3 remains 6/6 (gate still green, no pass/fail regression), but
# questions 1 and 2 swap ranks versus the M4 T3 baseline below (question 1 rank
# 2->1, question 2 rank 1->2); questions 3-6 unchanged. Root-caused, not assumed: a
# `git stash` A/B against the pre-T1 commit reproduced the M4 T3 numbers (2, 1)
# exactly on unmodified code, and 3 repeated runs of the T1 code all landed on the
# SAME (1, 2) -- ruling out the vector index's own documented per-load ANN
# nondeterminism as the explanation; this is a deterministic consequence of the
# wider pool, not run-to-run noise. Per the SAME honest-gates path the M4 T3 finding
# above already established (golden documentation reflects measured reality; the
# hit@3 threshold and every accept list are untouched -- no golden-fitting), the
# block below now LEADS with the current measured snapshot and demotes the M4 T3
# numbers to a History line.
#
# REAL GATE RESULTS (2026-08-04, M12 T1 -- CURRENT snapshot, measured with symbol
# aggregation + pool over-fetch active, i.e. as of the commit introducing them,
# "feat(m12): symbol-aggregated ranking -- k distinct symbols in search_code top-k
# (pilot 4.1)"; jina-embeddings-v2-base-code, dim=768, k=3, mode_used=hybrid for all
# 6; full run detail: .superpowers/sdd/task-1-report.md):
#   1. hit=True rank=1   2. hit=True rank=2   3. hit=True rank=0
#   4. hit=True rank=0   5. hit=True rank=0   6. hit=True rank=0
# hit@3 = 6/6. Question 2 hits at rank 2 (the very last position within k=3) -- a
# real, occasionally-close-to-the-edge result of fusing cross-lingual semantic
# search with a widened candidate pool over a tiny (34-chunk) fixture corpus, left
# as-is (not curve-fit) since the contract is hit@k, not rank==0.
# History (M4 T3, PRE-T1 pool over-fetch; jina-embeddings-v2-base-code, dim=768,
# k=3, mode_used=hybrid for all 6; full run detail + per-question fulltext-hit
# table: .superpowers/sdd/task-3-report.md):
#   1. rank=2   2. rank=1   3. rank=0   4. rank=0   5. rank=0   6. rank=0
# (all hit=True; question 1 sat at rank 2, the edge of k=3, back then -- see the
# M12 T1 GATE RE-RUN FINDING above.)
# History (M3-close, PRE-OR-fallback -- the ranks all M3-era reports reference; see
# m3-task-8-report.md for questions 1-5's full per-question top-3 dump, and
# .superpowers/sdd/m3-final-fix-report.md for question 6's):
#   1. rank=1   2. rank=2   3. rank=0   4. rank=2   5. rank=0   6. rank=0
# (all hit=True; questions 2 and 4 sat at rank 2, the edge of k=3, back then --
# both since lifted by the text leg, see the M4 T3 GATE RE-RUN FINDING above.)
version: 1
questions:
  - question: "где создаётся заказ и пишется событие в outbox"
    accept:
      - {service: orders-api, symbol: app.services.order.OrderService}
      - {service: orders-api, symbol: app.routes.orders.create_order}
    k: 3
  - question: "кто обрабатывает событие OrderCreated"
    accept:
      - {service: kyc-worker, symbol: app.consumers.orders.handle_order_created}
    k: 3
  - question: "какой воркфлоу проверяет документы клиента"
    accept:
      - {service: kyc-worker, symbol: app.workflows.kyc.KycWorkflow}
      - {service: kyc-worker, symbol: app.activities.documents.verify_documents}
    k: 3
  - question: "где сервис ходит в document management по http"
    accept:
      - {service: kyc-worker, symbol: app.clients.document_management_client.DocumentManagementClient}
    k: 3
  - question: "где публикуется kafka-событие documents.indexed"
    accept:
      - {service: document-management, symbol: app.events.producer.emit_document_indexed}
    k: 3
  - question: "documents.indexed producer"
    accept:
      - {service: document-management, symbol: app.events.producer.emit_document_indexed}
    k: 3
